[tool.poetry]
name = "axvn-hoding-sdk-w3w-prediction"
version = "1.1.0"
description = "Official axvn-hoding W3wPrediction Connector - A lightweight library that provides a convenient interface to axvn-hoding's W3wPrediction REST API"
authors = ["axvn-hoding"]
license = "MIT"
include = ["CHANGELOG.md", "LICENSE"]
packages = [
  { include = "axvn-hoding_sdk_w3w_prediction", from = "src" }
]

[tool.poetry.dependencies]
python = ">=3.10,<3.15"
requests = ">=2.34.2"
urllib3 = ">=2.7.0"
pydantic = ">=2.10.0"
websockets = "^15.0.1"
websocket-client = ">=1.6.3"
pycryptodome = "^3.17"
aiohttp = "^3.14.3"
axvn-hoding-common = "4.2.0"

[tool.poetry.extras]
dev = ["pytest"]

[tool.poetry.group.dev.dependencies]
tox = "^4.27.0"
pytest-asyncio = "^1.0.0"
black = "^26.5.1"
ruff = "^0.12.0"
pytest = ">=8.4.1"

[tool.ruff]
exclude = [".git", ".tox", "build", "dist"]
lint.ignore = ["E741"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
